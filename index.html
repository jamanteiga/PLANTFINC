<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PLANTFINC v1.1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--pri:#2e7d32;--pri-dark:#1b5e20;--bg:#f4f6f8;--surface:#fff;--text:#1a1a1a;--border:#e0e0e0;--danger:#c62828;--warn:#ef6c00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
header{background:#fff;color:var(--text);padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-weight:700;border-bottom:1px solid var(--border);z-index:30;gap:8px;min-height:46px}
.hb{background:none;border:none;color:var(--pri-dark);font-size:.9rem;font-weight:600;cursor:pointer;padding:4px 6px;justify-self:start}
#h-more{justify-self:end;font-size:1.3rem}
.gpsChip{position:absolute;top:8px;left:8px;z-index:16;background:#fff;border:none;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.28);padding:6px 11px;font-size:.74rem;font-weight:600;cursor:pointer}
.hdr-r{display:flex;align-items:center;gap:6px}
.hbtn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:12px;padding:5px 9px;font-size:.75rem;font-weight:600;cursor:pointer}
.hbtn.on{background:#fff;color:var(--pri-dark)}
.status-badge{font-size:.72rem;background:rgba(255,255,255,.2);padding:4px 8px;border-radius:12px;white-space:nowrap}
#app{flex:1;min-height:0;position:relative;overflow:hidden}
#map{position:absolute;inset:0}
.strip{position:absolute;top:8px;left:8px;z-index:15;background:#fff;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.28);padding:6px 12px;font-size:.78rem;font-weight:700;color:var(--pri-dark);border:none;cursor:pointer;display:flex;gap:6px;align-items:center}
.strip i{font-style:normal;color:#999;font-weight:400}
.rbtns{position:absolute;right:10px;top:116px;z-index:15;display:grid;gap:10px}
.rb{width:44px;height:44px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:1.25rem;cursor:pointer}
.rb.on{background:var(--pri);color:#fff}
.menu{position:absolute;right:62px;top:116px;z-index:26;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);padding:8px;display:grid;gap:6px;min-width:150px}
.menu .hbtn{background:#eef1f3;color:var(--text);padding:10px 12px;font-size:.85rem;text-align:left;border-radius:8px}
.menu .hbtn.on{background:var(--pri);color:#fff}
.tb{position:absolute;left:0;right:0;bottom:0;z-index:22;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.12)}
.tb button{flex:1;background:none;border:none;padding:6px 2px 7px;font-size:.68rem;font-weight:600;color:#555;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tb button b{font-size:1.25rem;line-height:1.2}
.tb button.act{color:var(--pri-dark);background:var(--pri2,#e8f5e9)}
.sheet{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:21;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.25);max-height:58%;display:flex;flex-direction:column}
.sh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;border-bottom:1px solid var(--border)}
.sh b{font-size:1rem}
.sh button{background:#eef1f3;border:none;border-radius:50%;width:30px;height:30px;font-size:1rem;cursor:pointer}
@media(min-width:800px){.sheet{left:10px;right:auto;width:430px;max-height:calc(100% - 80px);border-radius:14px}}
#tab-content{padding:12px;overflow-y:auto;display:grid;gap:10px;align-content:start}
label{font-size:.75rem;color:#555;display:block;margin-bottom:2px}
input,select{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:1rem;background:#fff;color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text)}
.chk input{width:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2e{display:grid;grid-template-columns:1fr auto;gap:8px}
.g3e{display:grid;grid-template-columns:1fr auto auto auto;gap:6px}
.btn{background:var(--pri);color:#fff;border:none;padding:10px 12px;border-radius:8px;font-weight:600;cursor:pointer;width:100%;font-size:.85rem}
.btn:active{background:var(--pri-dark)}
.btn.sec{background:#e0e0e0;color:var(--text)}
.btn.danger{background:#fdecea;color:var(--danger)}
.mini{background:#e0e0e0;border:none;border-radius:6px;padding:3px 8px;font-size:.75rem;cursor:pointer;margin-left:6px}
.muted{font-size:.75rem;color:#666}
.edge{border:1px solid var(--border);border-radius:10px;padding:8px;display:grid;gap:6px}
.eh{font-size:.85rem}
.sp{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:2px 0}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid #888;flex:none}
.warn{border-left:4px solid var(--warn);background:#fff8e1;padding:8px;border-radius:6px;font-size:.8rem}
.warn.danger{border-left-color:var(--danger);background:#fdecea}
.warn.info{border-left-color:#1976d2;background:#e8f1fb}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{padding:4px;border-bottom:1px solid var(--border);text-align:left}
td input,td select{padding:5px;font-size:.85rem}
h4{font-size:.85rem;color:var(--pri-dark)}
#drawbar{position:absolute;top:8px;left:8px;right:8px;z-index:25;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:8px;display:grid;gap:6px}
#drawbar .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:70px;background:rgba(30,30,30,.92);color:#fff;padding:8px 14px;border-radius:18px;font-size:.8rem;z-index:40;max-width:90%;text-align:center;display:none}
.hidden{display:none!important}
/* compacto */
input,select{padding:5px 7px;font-size:.85rem;border-radius:6px}
label{font-size:.68rem;margin-bottom:1px}
.btn{padding:7px 8px;font-size:.78rem;border-radius:7px}
#tab-content{padding:8px 10px;gap:6px}
.edge{padding:6px;gap:4px}
.sheet{max-height:44%;bottom:calc(46px + env(safe-area-inset-bottom))}
.sh{padding:6px 12px 4px}.sh b{font-size:.9rem}.sh button{width:26px;height:26px;font-size:.85rem}
.tb button{padding:4px 2px 5px;font-size:.62rem}.tb button b{font-size:1.05rem}
details{border:1px solid var(--border);border-radius:8px;padding:0 8px}
details>summary{font-size:.8rem;font-weight:700;color:var(--pri-dark);padding:7px 0;cursor:pointer}
details[open]>summary{border-bottom:1px solid var(--border);margin-bottom:6px}
details>*:not(summary){margin-bottom:6px}
@media(min-width:800px){.sheet{width:340px;max-height:calc(100% - 70px)}}
.tb{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));border:1px solid var(--border);border-radius:14px;overflow:hidden}
.sheet{bottom:calc(66px + env(safe-area-inset-bottom))}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:62px}
.strip{top:44px}
.vlist{position:absolute;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:10px 10px 90px}
.vlist .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin-bottom:10px;overflow:hidden}
.fin{display:flex;gap:10px;align-items:center;padding:12px;cursor:pointer}
.ic{width:38px;height:38px;border-radius:8px;background:#e8f5e9;display:grid;place-items:center;font-size:1.3rem;flex:none}
.fin .t{font-weight:700}.fin .s{font-size:.78rem;color:#666}
.facts{display:flex;border-top:1px solid var(--border)}
.facts button{flex:1;background:none;border:none;padding:9px 2px;font-size:.78rem;color:var(--pri);font-weight:600;cursor:pointer}
.facts .rojo{color:var(--danger)}
.last{background:var(--pri);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;width:100%;border:none;text-align:left;display:block;font-weight:700;cursor:pointer;font-size:.95rem}
.last small{display:block;font-weight:400;opacity:.9;font-size:.78rem}
.fab{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;background:var(--pri);color:#fff;border:none;border-radius:26px;padding:13px 20px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer}
.nsheet{bottom:0!important;z-index:60;max-height:85%!important}
.nbody{padding:10px 12px;display:grid;gap:7px;overflow-y:auto}
.empty{text-align:center;color:#777;padding:40px 10px;font-size:.9rem}
#hmenu{right:8px;top:6px;z-index:40;min-width:180px}
#sgbar{position:absolute;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:24;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:8px;display:grid;gap:6px}
#sgbar .g3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}
.btn:disabled{opacity:.45}
.enum{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
.erow{border:1px solid var(--border);border-radius:8px;padding:4px 6px}
.e1{display:grid;grid-template-columns:28px 40px 1fr auto;gap:6px;align-items:center}
.elen{font-size:.78rem;color:#555}
.badge{width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#fff;font-weight:700;font-size:.75rem;box-shadow:0 0 0 1px #888;cursor:pointer}
.e2{display:grid;gap:5px;margin-top:5px}
.cota{background:#fff;color:#0d47a1;border:1.5px solid #0d47a1;border-radius:6px;padding:1px 5px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
#msbar{position:absolute;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:24;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:8px;display:grid;gap:6px}
#msbar .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#ms-info{font-size:.85rem;color:#0d47a1;font-weight:700}
.efr{display:flex;align-items:center;gap:3px;font-size:.7rem;white-space:nowrap}
.efr input{width:auto}
#trbar{position:absolute;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:24;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:8px;display:grid;gap:6px}
#trbar .g3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px}
#tr-info{font-size:.82rem;color:#e65100;font-weight:700}
.stp{display:grid;grid-template-columns:34px 1fr 34px;gap:4px;align-items:center}.stp .mini{margin:0;padding:6px 0;font-size:1rem;font-weight:700}
#ttbar{position:absolute;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:24;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:8px;display:grid;gap:6px}
#tt-info{font-size:.85rem;color:#1b5e20;font-weight:700}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg2 .btn.on{background:var(--pri);color:#fff}
</style>
</head>
<body>
<header>
  <button class="hb hidden" id="h-back">&#x2039; Fincas</button>
  <span id="finca-title" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;justify-self:center;grid-column:2;cursor:pointer">PLANTFINC</span>
  <button class="hb hidden" id="h-more" aria-label="Más opciones">&#x22EF;</button>
</header>
<input type="file" id="file" accept=".json,.geojson,application/geo+json,application/json" class="hidden">

<div id="app">
  <div id="map"></div>
  <div id="toast"></div>

  <button class="gpsChip" id="gps-status">GPS: esperando…</button>
  <button class="strip" id="strip" aria-label="Resumen"><span id="m-area">0.00 ha</span><i>·</i><span><span id="m-ferr">—</span> ferr.</span><i>·</i><span><span id="m-trees">0</span> árb.</span></button>

  <div class="rbtns">
    <button class="rb" id="btn-loc" aria-label="Centrar en mi posición">&#x25CE;</button>
    <button class="rb" id="btn-lay" aria-label="Capas">&#x1F5C2;</button>
  </div>
  <div class="menu hidden" id="hmenu">
    <button class="hbtn" data-act="report">&#x1F4C4; Informe A4</button>
    <button class="hbtn" data-act="export">&#x1F4E4; Exportar GeoJSON</button>
    <button class="hbtn" data-act="save-center">&#x1F4CD; Fijar centro de inicio</button>
    <button class="hbtn" data-act="del" style="color:var(--danger)">&#x1F5D1; Eliminar finca</button>
  </div>
  <div class="menu hidden" id="menu">
    <button class="hbtn" id="btn-base">Mapa: OpenStreetMap</button>
    <button class="hbtn" id="btn-3d">Relieve 3D</button>
    <button class="hbtn on" id="btn-gps">GPS activo</button>
  </div>

  <div id="trbar" class="hidden">
    <div id="tr-info" class="muted"></div>
    <div class="g2"><div><label>Este tramo colinda con</label><select id="tr-tipo"></select></div><div><label>Árbol en el tramo</label><select id="tr-arb"></select></div></div>
    <div class="g3">
      <button class="btn sec" id="tr-rev">&#x21C4; Invertir</button>
      <button class="btn sec" id="tr-x">Cancelar</button>
      <button class="btn" id="tr-ok" disabled>Aplicar</button>
    </div>
  </div>
  <div id="ttbar" class="hidden">
    <div id="tt-info" class="muted"></div>
    <div class="g2e"><div id="tt-sp-wrap"><label>Árbol a añadir</label><select id="tt-sp"></select></div><button class="btn" id="tt-ok" style="width:auto;align-self:end">Terminar</button></div>
  </div>
  <div id="msbar" class="hidden">
    <div class="seg2"><button class="btn sec on" id="ms-pp">&#x2194; Punto a punto</button><button class="btn sec" id="ms-pl">&#x22A5; Punto a lindero</button></div>
    <div id="ms-info" class="muted"></div>
    <div class="g3">
      <button class="btn sec" id="ms-undo">Borrar última</button>
      <button class="btn sec" id="ms-clear">Borrar todas</button>
      <button class="btn" id="ms-ok">Terminar</button>
    </div>
  </div>
  <div id="sgbar" class="hidden">
    <div id="sg-info" class="muted">Acércate hasta ver las parcelas SIGPAC (líneas naranjas).</div>
    <div class="g3">
      <button class="btn sec" id="sg-x">Cancelar</button>
      <button class="btn sec" id="sg-me">&#x1F4CD; Mi posición</button>
      <button class="btn" id="sg-use" disabled>Usar selección</button>
    </div>
  </div>
  <div id="rsheet" class="sheet nsheet hidden"></div>
  <div id="drawbar" class="hidden">
    <div id="drawmsg" class="muted"></div>
    <div class="g3">
      <button class="btn sec" id="d-undo">Deshacer</button>
      <button class="btn sec" id="d-cancel">Cancelar</button>
      <button class="btn" id="d-ok">Finalizar</button>
    </div>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sh"><b id="sheet-title">Finca</b><button id="sheet-x" aria-label="Cerrar">&#x2715;</button></div>
    <div id="tab-content"></div>
  </div>

  <div id="vList" class="vlist"></div>
  <button class="fab" id="fab" data-act="l-new">&#xFF0B; Nueva finca</button>
  <div id="nsheet" class="sheet nsheet hidden">
    <div class="sh"><b>Nueva finca</b><button id="n-x" aria-label="Cerrar">&#x2715;</button></div>
    <div class="nbody">
      <div><label>Nombre</label><input id="n-name" placeholder="p. ej. A Veiga Pol. 508 Parc. 1581"></div>
      <div><label>Concello</label><select id="n-conc"></select></div>
      <button class="btn" data-act="n-pick">&#x1F5FA; Elegir la parcela en el mapa SIGPAC</button>
      <button class="btn sec" data-act="n-gps">&#x1F4CC; Parcela SIGPAC en mi posición</button>
      <div class="g2e"><input id="n-q" placeholder="SIGPAC 15-5-0-0-12-345 ó ref. catastral"><button class="btn" data-act="n-search" style="width:auto">Buscar</button></div>
      <button class="btn sec" data-act="n-import">&#x1F4E5; Importar GeoJSON (p. ej. de LIMPFINC)</button>
    </div>
  </div>
  <nav class="tb" id="tabs">
    <button data-tab="finca"><b>&#x1F5FA;</b>Finca</button>
    <button data-tab="linderos"><b>&#x1F4D0;</b>Linderos</button>
    <button data-tab="matriz"><b>&#x1F332;</b>Matriz</button>
    <button data-tab="medir"><b>&#x1F4CF;</b>Medir</button>
    <button data-tab="informe"><b>&#x1F4C4;</b>Informe</button>
    <button data-tab="norma"><b>&#x2696;&#xFE0F;</b>Normativa</button>
  </nav>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script src="core.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const S = PF.SPECIES, L = PF.LINDEROS, C = PF.CONCELLOS;
  const LS = 'plantfinc.v1';
  // Centro por defecto: Igrexa de San Xián de Cabanas (Abegondo), O Igrexario. Ajustable en Finca > Fijar centro de inicio
  const CENTER_DEFAULT = [-8.297659, 43.2115341];
  const EMPTY = { type: 'FeatureCollection', features: [] };
  const USOS = { eucalipto: 'Eucalipto', conifera: 'Conífera (pino…)', frondosas: 'Frondosas', agricola: 'Agrícola / pasto', otro: 'Otro / desconocido' };
  const SUELOS = { forestal: 'Forestal / rústico común', agricola: 'Parcela agrícola / prado', agropec: 'Rústico protección agropecuaria', urbano: 'Núcleo rural / urbano / urbanizable' };

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v, d) => (isFinite(+v) && v !== '' && v !== null ? +v : d);

  /* ---------- estado y persistencia ---------- */
  function loadStore() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } }
  let store = loadStore();
  store.fincas = store.fincas || {};
  const norm = PF.defaultNorm();
  Object.keys(store.norm || {}).forEach((k) => { if (norm[k]) norm[k] = { fr: num(store.norm[k].fr, norm[k].fr), resto: num(store.norm[k].resto, norm[k].resto) }; });

  function newFinca() {
    return migrate({ id: 'f' + Date.now(), name: 'Finca nueva', ring: null });
  }
  function migrate(f) {
    const d = { concello: 'abegondo', uso: 'eucalipto', suelo: 'forestal', natura: false, ferrado: null, edges: [], exclusions: [], subzonas: [] };
    Object.keys(d).forEach((k) => { if (f[k] === undefined) f[k] = d[k]; });
    if (f.maxEdges == null) f.maxEdges = 80;
    f.params = Object.assign({ sx: 3.5, sy: 3.5, angle: 0, shU: 0, shV: 0, rows: 1, core: 'nitens', anchor: null, opt: 'auto', dmin: 3 }, f.params || {});
    f.econ = f.econ || {};
    f.econ.coste = f.econ.coste == null ? null : f.econ.coste;
    f.econ.sp = f.econ.sp || {};
    Object.keys(S).forEach((k) => { f.econ.sp[k] = Object.assign({ planta: null, rend: null, precio: null, destino: 'papelera' }, f.econ.sp[k] || {}); });
    if (!f.v5) {   // v0.5: 1 fila de frondosas y máx. 10 linderos
      f.v5 = 1; if (f.params.rows === 3) f.params.rows = 1;
      if (f.maxEdges === 20) f.maxEdges = 10;
      if (f.ringOrig) { f.ring = simplifyRing(f.ringOrig, f.maxEdges); f.edges = []; f.params.anchor = null; }
    }
    if (!f.v7) {   // v0.8: un lindero = tramo continuo; el contorno conserva su forma real
      f.v7 = 1; f.maxEdges = 80;
      if (f.ringOrig) { f.ring = simplifyRing(f.ringOrig, 80); f.edges = []; f.params.anchor = null; }
    }
    if (!f.v6) {   // v0.7: por defecto solo eucalipto; las frondosas de lindero las eliges tú
      f.v6 = 1; (f.edges || []).forEach((e) => { e.franja = false; });
    }
    f.cotas = f.cotas || []; f.manual = f.manual || []; f.removed = f.removed || [];
    if (f.ring) PF.ensureEdges(f);

  /* ---------- eventos del contenido ---------- */
  function setPath(obj, path, v) {
    const ks = path.split('.'); let o = obj;
    for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
    o[ks[ks.length - 1]] = v;
  }
  function readVal(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.type === 'number') return el.value === '' ? null : +el.value;
    return el.value;
  }
  $('#tab-content').addEventListener('change', (e) => {
    const t = e.target, v = readVal(t);
    if (t.dataset.bind) {
      setPath(finca, t.dataset.bind, v);
      if (t.dataset.bind === 'concello') { renderTab(); }
      recalc();
    } else if (t.dataset.run) {
      const a = t.dataset.run.split(':'), R = runs()[+a[0]], f = a[1]; if (!R) return;
      R.edges.forEach((i) => { const e = finca.edges[i]; if (f === 'arbol') { if (v === 'euc') e.franja = false; else { e.franja = true; e.especie = v; } } else e[f] = v; });
      recalc(); if (f !== 'vecino') { openEdge = -1; renderTab(); }
    } else if (t.dataset.global) {
      if (!v) return;
      finca.edges.forEach((e) => { if (v === 'euc') e.franja = false; else { e.franja = true; e.especie = v; } });
      recalc(); renderTab(); toast(v === 'euc' ? 'Todos los límites con eucalipto' : 'Todos los límites con ' + S[v].name);
    } else if (t.dataset.edge) {
      const a = t.dataset.edge.split(':'), i = +a[0], f = a[1];
      finca.edges[i][f] = v;
      if (f === 'tipo') renderTab();
      recalc();
    } else if (t.dataset.norm) {
      const a = t.dataset.norm.split(':'); norm[a[0]][a[1]] = num(v, 0); recalc();
    } else if (t.id === 'file') {
      const f = t.files && t.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try { setRing(PF.ringFromGeoJSON(JSON.parse(rd.result)), f.name.replace(/\.[^.]+$/, '')); toast('Finca importada'); }
        catch (err) { toast('Importación fallida: ' + err.message, 6000); }
      };
      rd.readAsText(f); t.value = '';
    }
  });

  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  const slug = (s) => String(s || 'finca').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'finca';

  function exportGeo() {
    if (!prep) { toast('No hay datos'); return; }
    const fc = { type: 'FeatureCollection', features: [polyFeature(finca.ring, { name: finca.name, tipo: 'finca' })].concat(
      res.trees.map((t) => ({ type: 'Feature', properties: { especie: S[t.sp].name, color: S[t.sp].color }, geometry: { type: 'Point', coordinates: prep.pj.toLL(t.x, t.y) } }))) };
    download('plantfinc-' + slug(finca.name) + '.geojson', JSON.stringify(fc), 'application/geo+json');
  }
  function fileImport(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { setRing(PF.ringFromGeoJSON(JSON.parse(rd.result)), f.name.replace(/\.[^.]+$/, '')); toast('Finca importada'); }
      catch (err) { toast('Importación fallida: ' + err.message, 6000); }
    };
    rd.readAsText(f); e.target.value = '';
  }
  $('#file').addEventListener('change', fileImport);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b || !b.closest('#tab-content,#hmenu,#vList,#nsheet,#fab,#rsheet')) return;
    const a = b.dataset.act, i = +b.dataset.i, id = b.dataset.id;
    $('#hmenu').classList.add('hidden');
    switch (a) {
      case 'draw-finca': startDraw('finca'); break;
      case 'import': $('#file').click(); break;
      case 'pick': startDraw('pick'); break;
      case 'gps-parcel': if (lastFix) parcelAtPoint(lastFix[0], lastFix[1]); else toast('Sin posición GPS todavía'); break;
      case 'search': searchParcel($('#q').value); break;
      case 'fit': closeSheet(); fitFinca(); break;
      case 'center-me': closeSheet(); if (lastFix && mapReady) map.flyTo({ center: [lastFix[0], lastFix[1]], zoom: 18 }); else toast('Sin posición GPS todavía'); break;
      case 'l-open': if (store.fincas[id]) openFinca(store.fincas[id]); break;
      case 'l-edit': if (store.fincas[id]) { openFinca(store.fincas[id]); openSheet('finca'); } break;
      case 'l-exp': if (store.fincas[id]) { openFinca(store.fincas[id]); exportGeo(); } break;
      case 'l-copy': if (store.fincas[id]) { const c = JSON.parse(JSON.stringify(store.fincas[id])); c.id = 'f' + Date.now(); c.name += ' (copia)'; c.mod = Date.now(); store.fincas[c.id] = c; try { localStorage.setItem(LS, JSON.stringify(store)); } catch (er) { /* */ } renderList(); toast('Finca copiada'); } break;
      case 'l-del': if (store.fincas[id] && confirm('¿Eliminar «' + store.fincas[id].name + '» de este dispositivo?')) { delete store.fincas[id]; if (store.last === id) store.last = null; try { localStorage.setItem(LS, JSON.stringify(store)); } catch (er) { /* */ } renderList(); } break;
      case 'l-new': $('#n-conc').innerHTML = optsObj(C, 'abegondo', (v) => v.name); $('#n-name').value = ''; $('#n-q').value = ''; $('#nsheet').classList.remove('hidden'); break;
      case 'l-import': flush(); finca = newFinca(); enterMap(); recalc(); renderTab(); $('#file').click(); break;
      case 'n-pick': createFromSheet(); startSigpac(); break;
      case 'sigpac-map': startSigpac(); break;

    const tr2 = Math.max(0.45, Math.min(finca.params.sx, finca.params.sy) * sc * 0.32), th = tr2 * 2.2;
    tr.forEach((t) => { iso += '<line x1="' + t.q[0] + '" y1="' + t.q[1] + '" x2="' + t.q[0] + '" y2="' + (t.q[1] - th).toFixed(2) + '" stroke="#5d4037" stroke-width="' + (tr2 * 0.25).toFixed(2) + '"/><circle cx="' + t.q[0] + '" cy="' + (t.q[1] - th).toFixed(2) + '" r="' + tr2.toFixed(2) + '" fill="' + S[t.sp].color + '" stroke="#fff" stroke-width="0.06"/>'; });
    ring.forEach((p, i) => { const q = (i + 1) % ring.length; iso += '<line x1="' + ringQ[i][0] + '" y1="' + ringQ[i][1] + '" x2="' + ringQ[q][0] + '" y2="' + ringQ[q][1] + '" stroke="' + (L[finca.edges[i].tipo] || L.libre).color + '" stroke-width="0.7"/>'; });
    iso += '</g>';
    // norte: dirección (0,1) proyectada
    const nv = P(0, 1, 0), nl = Math.hypot(nv[0], nv[1]), nang = Math.atan2(nv[0], -nv[1]) * 180 / Math.PI;
    iso += north(IW - 12, 16, 1.2, nang.toFixed(1)) + '</g>';
    let p2 = title.replace('Plan de plantación', 'Vista isométrica 3D');
    p2 += iso;
    // texto lateral / inferior
    const tx0 = land ? M + IW + 8 : M, tw = land ? PW - tx0 - M : MW; let y2 = land ? MY + 4 : MY + IH + 8; const nch = Math.floor(tw / 1.75);
    const line = (txt, fs, bold, col) => { p2 += '<text x="' + tx0 + '" y="' + y2 + '" font-size="' + fs + '"' + (bold ? ' font-weight="bold"' : '') + (col ? ' fill="' + col + '"' : '') + '>' + esc(txt) + '</text>'; y2 += fs * 1.45; };
    line('Relieve', 3.9, true);
    line(haveZ ? 'MDT CNIG · cota ' + Math.round(zmin) + ' – ' + Math.round(zmax) + ' m · desnivel ' + Math.round(zmax - zmin) + ' m (exagerado ×' + EXA + ')' : 'Sin datos de relieve: vista sobre terreno plano.', 3.2); y2 += 2;
    line('Árboles: ' + res.total, 3.9, true);
    Object.keys(S).filter((s) => res.counts[s]).forEach((s) => { p2 += '<circle cx="' + (tx0 + 2) + '" cy="' + (y2 - 1.1) + '" r="1.9" fill="' + S[s].color + '" stroke="#333" stroke-width="0.25"/><text x="' + (tx0 + 6) + '" y="' + y2 + '" font-size="3.4">' + esc(S[s].name) + ': ' + res.counts[s] + '</text>'; y2 += 4.8; });
    y2 += 2;
    if (hasEcon) { line('Economía estimada', 3.9, true); line('Coste: ' + eur(ec.cost) + '   Ingreso: ' + eur(ec.inc), 3.4); y2 += 2; }
    const wl = warnings().filter((x) => x.l !== 'info');
    line('Avisos', 3.9, true);
    if (!wl.length) line('Sin avisos críticos.', 3.2);
    wl.slice(0, land ? 14 : 12).forEach((x) => wrapTxt('• ' + x.t, nch).slice(0, 3).forEach((l) => line(l, 2.9)));
    const page2 = head(p2) + '</svg>';

    try {
      const j1 = await svgToJpeg(page1, PW, PH), j2 = await svgToJpeg(page2, PW, PH);
      const pdf = makePDF([j1, j2], PW / 25.4 * 72, PH / 25.4 * 72);
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([pdf], { type: 'application/pdf' }));
      a.download = 'informe-' + slug(finca.name) + '.pdf'; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      toast('PDF generado (' + (land ? 'apaisado' : 'vertical') + ', 2 páginas)', 4000);
    } catch (er) { toast('Error al crear el PDF: ' + er.message, 7000); }
  }

  /* ---------- arranque ---------- */
  finca = newFinca();
  renderTab();
  initMap();
  showList();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
