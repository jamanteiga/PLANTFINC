<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PLANTFINC v0.5</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--pri:#2e7d32;--pri-dark:#1b5e20;--bg:#f4f6f8;--surface:#fff;--text:#1a1a1a;--border:#e0e0e0;--danger:#c62828;--warn:#ef6c00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
header{background:#fff;color:var(--text);padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-weight:700;border-bottom:1px solid var(--border);z-index:30;gap:8px;min-height:46px}
.hb{background:none;border:none;color:var(--pri-dark);font-size:.9rem;font-weight:600;cursor:pointer;padding:4px 6px;justify-self:start}
#h-more{justify-self:end;font-size:1.3rem}
.gpsChip{position:absolute;top:8px;left:8px;z-index:16;background:#fff;border:none;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.28);padding:6px 11px;font-size:.74rem;font-weight:600;cursor:pointer}
.hdr-r{display:flex;align-items:center;gap:6px}
.hbtn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:12px;padding:5px 9px;font-size:.75rem;font-weight:600;cursor:pointer}
.hbtn.on{background:#fff;color:var(--pri-dark)}
.status-badge{font-size:.72rem;background:rgba(255,255,255,.2);padding:4px 8px;border-radius:12px;white-space:nowrap}
#app{flex:1;min-height:0;position:relative;overflow:hidden}
#map{position:absolute;inset:0}
.strip{position:absolute;top:8px;left:8px;z-index:15;background:#fff;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.28);padding:6px 12px;font-size:.78rem;font-weight:700;color:var(--pri-dark);border:none;cursor:pointer;display:flex;gap:6px;align-items:center}
.strip i{font-style:normal;color:#999;font-weight:400}
.rbtns{position:absolute;right:10px;top:116px;z-index:15;display:grid;gap:10px}
.rb{width:44px;height:44px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:1.25rem;cursor:pointer}
.rb.on{background:var(--pri);color:#fff}
.menu{position:absolute;right:62px;top:116px;z-index:26;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);padding:8px;display:grid;gap:6px;min-width:150px}
.menu .hbtn{background:#eef1f3;color:var(--text);padding:10px 12px;font-size:.85rem;text-align:left;border-radius:8px}
.menu .hbtn.on{background:var(--pri);color:#fff}
.tb{position:absolute;left:0;right:0;bottom:0;z-index:22;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.12)}
.tb button{flex:1;background:none;border:none;padding:6px 2px 7px;font-size:.68rem;font-weight:600;color:#555;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tb button b{font-size:1.25rem;line-height:1.2}
.tb button.act{color:var(--pri-dark);background:var(--pri2,#e8f5e9)}
.sheet{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:21;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.25);max-height:58%;display:flex;flex-direction:column}
.sh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;border-bottom:1px solid var(--border)}
.sh b{font-size:1rem}
.sh button{background:#eef1f3;border:none;border-radius:50%;width:30px;height:30px;font-size:1rem;cursor:pointer}
@media(min-width:800px){.sheet{left:10px;right:auto;width:430px;max-height:calc(100% - 80px);border-radius:14px}}
#tab-content{padding:12px;overflow-y:auto;display:grid;gap:10px;align-content:start}
label{font-size:.75rem;color:#555;display:block;margin-bottom:2px}
input,select{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:1rem;background:#fff;color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text)}
.chk input{width:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2e{display:grid;grid-template-columns:1fr auto;gap:8px}
.g3e{display:grid;grid-template-columns:1fr auto auto auto;gap:6px}
.btn{background:var(--pri);color:#fff;border:none;padding:10px 12px;border-radius:8px;font-weight:600;cursor:pointer;width:100%;font-size:.85rem}
.btn:active{background:var(--pri-dark)}
.btn.sec{background:#e0e0e0;color:var(--text)}
.btn.danger{background:#fdecea;color:var(--danger)}
.mini{background:#e0e0e0;border:none;border-radius:6px;padding:3px 8px;font-size:.75rem;cursor:pointer;margin-left:6px}
.muted{font-size:.75rem;color:#666}
.edge{border:1px solid var(--border);border-radius:10px;padding:8px;display:grid;gap:6px}
.eh{font-size:.85rem}
.sp{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:2px 0}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid #888;flex:none}
.warn{border-left:4px solid var(--warn);background:#fff8e1;padding:8px;border-radius:6px;font-size:.8rem}
.warn.danger{border-left-color:var(--danger);background:#fdecea}
.warn.info{border-left-color:#1976d2;background:#e8f1fb}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{padding:4px;border-bottom:1px solid var(--border);text-align:left}
td input,td select{padding:5px;font-size:.85rem}
h4{font-size:.85rem;color:var(--pri-dark)}
#drawbar{position:absolute;top:8px;left:8px;right:8px;z-index:25;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:8px;display:grid;gap:6px}
#drawbar .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:70px;background:rgba(30,30,30,.92);color:#fff;padding:8px 14px;border-radius:18px;font-size:.8rem;z-index:40;max-width:90%;text-align:center;display:none}
.hidden{display:none!important}
/* compacto */
input,select{padding:5px 7px;font-size:.85rem;border-radius:6px}
label{font-size:.68rem;margin-bottom:1px}
.btn{padding:7px 8px;font-size:.78rem;border-radius:7px}
#tab-content{padding:8px 10px;gap:6px}
.edge{padding:6px;gap:4px}
.sheet{max-height:44%;bottom:calc(46px + env(safe-area-inset-bottom))}
.sh{padding:6px 12px 4px}.sh b{font-size:.9rem}.sh button{width:26px;height:26px;font-size:.85rem}
.tb button{padding:4px 2px 5px;font-size:.62rem}.tb button b{font-size:1.05rem}
details{border:1px solid var(--border);border-radius:8px;padding:0 8px}
details>summary{font-size:.8rem;font-weight:700;color:var(--pri-dark);padding:7px 0;cursor:pointer}
details[open]>summary{border-bottom:1px solid var(--border);margin-bottom:6px}
details>*:not(summary){margin-bottom:6px}
@media(min-width:800px){.sheet{width:340px;max-height:calc(100% - 70px)}}
.tb{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));border:1px solid var(--border);border-radius:14px;overflow:hidden}
.sheet{bottom:calc(66px + env(safe-area-inset-bottom))}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:62px}
.strip{top:44px}
.vlist{position:absolute;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:10px 10px 90px}
.vlist .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin-bottom:10px;overflow:hidden}
.fin{display:flex;gap:10px;align-items:center;padding:12px;cursor:pointer}
.ic{width:38px;height:38px;border-radius:8px;background:#e8f5e9;display:grid;place-items:center;font-size:1.3rem;flex:none}
.fin .t{font-weight:700}.fin .s{font-size:.78rem;color:#666}
.facts{display:flex;border-top:1px solid var(--border)}
.facts button{flex:1;background:none;border:none;padding:9px 2px;font-size:.78rem;color:var(--pri);font-weight:600;cursor:pointer}
.facts .rojo{color:var(--danger)}
.last{background:var(--pri);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;width:100%;border:none;text-align:left;display:block;font-weight:700;cursor:pointer;font-size:.95rem}
.last small{display:block;font-weight:400;opacity:.9;font-size:.78rem}
.fab{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;background:var(--pri);color:#fff;border:none;border-radius:26px;padding:13px 20px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer}
.nsheet{bottom:0!important;z-index:60;max-height:85%!important}
.nbody{padding:10px 12px;display:grid;gap:7px;overflow-y:auto}
.empty{text-align:center;color:#777;padding:40px 10px;font-size:.9rem}
#hmenu{right:8px;top:6px;z-index:40;min-width:180px}
#sgbar{position:absolute;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:24;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:8px;display:grid;gap:6px}
#sgbar .g3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}
.btn:disabled{opacity:.45}
.enum{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
.erow{border:1px solid var(--border);border-radius:8px;padding:4px 6px}
.e1{display:grid;grid-template-columns:28px 46px 1fr;gap:6px;align-items:center}
.elen{font-size:.78rem;color:#555}
.badge{width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#fff;font-weight:700;font-size:.75rem;box-shadow:0 0 0 1px #888;cursor:pointer}
.e2{display:grid;gap:5px;margin-top:5px}
</style>
</head>
<body>
<header>
  <button class="hb hidden" id="h-back">&#x2039; Fincas</button>
  <span id="finca-title" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;justify-self:center;grid-column:2;cursor:pointer">PLANTFINC</span>
  <button class="hb hidden" id="h-more" aria-label="Más opciones">&#x22EF;</button>
</header>
<input type="file" id="file" accept=".json,.geojson,application/geo+json,application/json" class="hidden">

<div id="app">
  <div id="map"></div>
  <div id="toast"></div>

  <button class="gpsChip" id="gps-status">GPS: esperando…</button>
  <button class="strip" id="strip" aria-label="Resumen"><span id="m-area">0.00 ha</span><i>·</i><span><span id="m-ferr">—</span> ferr.</span><i>·</i><span><span id="m-trees">0</span> árb.</span></button>

  <div class="rbtns">
    <button class="rb" id="btn-loc" aria-label="Centrar en mi posición">&#x25CE;</button>
    <button class="rb" id="btn-lay" aria-label="Capas">&#x1F5C2;</button>
  </div>
  <div class="menu hidden" id="hmenu">
    <button class="hbtn" data-act="report">&#x1F4C4; Informe A4</button>
    <button class="hbtn" data-act="export">&#x1F4E4; Exportar GeoJSON</button>
    <button class="hbtn" data-act="save-center">&#x1F4CD; Fijar centro de inicio</button>
    <button class="hbtn" data-act="del" style="color:var(--danger)">&#x1F5D1; Eliminar finca</button>
  </div>
  <div class="menu hidden" id="menu">
    <button class="hbtn" id="btn-base">Mapa: OpenStreetMap</button>
    <button class="hbtn" id="btn-3d">Relieve 3D</button>
    <button class="hbtn on" id="btn-gps">GPS activo</button>
  </div>

  <div id="sgbar" class="hidden">
    <div id="sg-info" class="muted">Acércate hasta ver las parcelas SIGPAC (líneas naranjas).</div>
    <div class="g3">
      <button class="btn sec" id="sg-x">Cancelar</button>
      <button class="btn sec" id="sg-me">&#x1F4CD; Mi posición</button>
      <button class="btn" id="sg-use" disabled>Usar selección</button>
    </div>
  </div>
  <div id="rsheet" class="sheet nsheet hidden"></div>
  <div id="drawbar" class="hidden">
    <div id="drawmsg" class="muted"></div>
    <div class="g3">
      <button class="btn sec" id="d-undo">Deshacer</button>
      <button class="btn sec" id="d-cancel">Cancelar</button>
      <button class="btn" id="d-ok">Finalizar</button>
    </div>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sh"><b id="sheet-title">Finca</b><button id="sheet-x" aria-label="Cerrar">&#x2715;</button></div>
    <div id="tab-content"></div>
  </div>

  <div id="vList" class="vlist"></div>
  <button class="fab" id="fab" data-act="l-new">&#xFF0B; Nueva finca</button>
  <div id="nsheet" class="sheet nsheet hidden">
    <div class="sh"><b>Nueva finca</b><button id="n-x" aria-label="Cerrar">&#x2715;</button></div>
    <div class="nbody">
      <div><label>Nombre</label><input id="n-name" placeholder="p. ej. A Veiga Pol. 508 Parc. 1581"></div>
      <div><label>Concello</label><select id="n-conc"></select></div>
      <button class="btn" data-act="n-pick">&#x1F5FA; Elegir la parcela en el mapa SIGPAC</button>
      <button class="btn sec" data-act="n-gps">&#x1F4CC; Parcela SIGPAC en mi posición</button>
      <div class="g2e"><input id="n-q" placeholder="SIGPAC 15-5-0-0-12-345 ó ref. catastral"><button class="btn" data-act="n-search" style="width:auto">Buscar</button></div>
      <button class="btn sec" data-act="n-import">&#x1F4E5; Importar GeoJSON (p. ej. de LIMPFINC)</button>
    </div>
  </div>
  <nav class="tb" id="tabs">
    <button data-tab="finca"><b>&#x1F5FA;</b>Finca</button>
    <button data-tab="linderos"><b>&#x1F4D0;</b>Linderos</button>
    <button data-tab="matriz"><b>&#x1F332;</b>Matriz</button>
    <button data-tab="informe"><b>&#x1F4C4;</b>Informe</button>
    <button data-tab="norma"><b>&#x2696;&#xFE0F;</b>Normativa</button>
  </nav>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script src="core.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const S = PF.SPECIES, L = PF.LINDEROS, C = PF.CONCELLOS;
  const LS = 'plantfinc.v1';
  // Centro por defecto: Igrexa de San Xián de Cabanas (Abegondo), O Igrexario. Ajustable en Finca > Fijar centro de inicio
  const CENTER_DEFAULT = [-8.297659, 43.2115341];
  const EMPTY = { type: 'FeatureCollection', features: [] };
  const USOS = { eucalipto: 'Eucalipto', conifera: 'Conífera (pino…)', frondosas: 'Frondosas', agricola: 'Agrícola / pasto', otro: 'Otro / desconocido' };
  const SUELOS = { forestal: 'Forestal / rústico común', agricola: 'Parcela agrícola / prado', agropec: 'Rústico protección agropecuaria', urbano: 'Núcleo rural / urbano / urbanizable' };

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v, d) => (isFinite(+v) && v !== '' && v !== null ? +v : d);

  /* ---------- estado y persistencia ---------- */
  function loadStore() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } }
  let store = loadStore();
  store.fincas = store.fincas || {};
  const norm = PF.defaultNorm();
  Object.keys(store.norm || {}).forEach((k) => { if (norm[k]) norm[k] = { fr: num(store.norm[k].fr, norm[k].fr), resto: num(store.norm[k].resto, norm[k].resto) }; });

  function newFinca() {
    return migrate({ id: 'f' + Date.now(), name: 'Finca nueva', ring: null });
  }
  function migrate(f) {
    const d = { concello: 'abegondo', uso: 'eucalipto', suelo: 'forestal', natura: false, ferrado: null, edges: [], exclusions: [], subzonas: [] };
    Object.keys(d).forEach((k) => { if (f[k] === undefined) f[k] = d[k]; });
    if (f.maxEdges == null) f.maxEdges = 20;
    f.params = Object.assign({ sx: 3.5, sy: 3.5, angle: 0, shU: 0, shV: 0, rows: 3, core: 'nitens', anchor: null }, f.params || {});
    f.econ = f.econ || {};
    f.econ.coste = f.econ.coste == null ? null : f.econ.coste;
    f.econ.sp = f.econ.sp || {};
    Object.keys(S).forEach((k) => { f.econ.sp[k] = Object.assign({ planta: null, rend: null, precio: null, destino: 'papelera' }, f.econ.sp[k] || {}); });
    if (f.ring) PF.ensureEdges(f);
    return f;
  }
  let finca = null, onList = true;
  let saveT = null;
  function flush() {
    clearTimeout(saveT);
    if (!finca || (!finca.ring && !finca._keep)) return;
    try {
      finca.mod = Date.now();
      store.fincas[finca.id] = finca; store.last = finca.id; store.norm = norm;
      localStorage.setItem(LS, JSON.stringify(store));
    } catch (e) { toast('No se pudo guardar en el dispositivo'); }
  }
  function persist() { clearTimeout(saveT); saveT = setTimeout(flush, 300); }

  let toastT = null;
  function toast(msg, ms) {
    const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, ms || 3500);
  }

  /* ---------- cálculo ---------- */
  let prep = null, res = { trees: [], counts: {}, total: 0 };
  function clampParams() {
    const p = finca.params;
    p.sx = Math.max(0.5, num(p.sx, 3.5)); p.sy = Math.max(0.5, num(p.sy, 3.5));
    p.angle = num(p.angle, 0); p.shU = num(p.shU, 0); p.shV = num(p.shV, 0);
    p.rows = Math.max(0, Math.round(num(p.rows, 3)));
    if (!S[p.core] || S[p.core].group !== 'euc') p.core = 'nitens';
  }
  function recalc() {
    clampParams();
    if (finca.ring && finca.ring.length >= 3) {
      PF.ensureEdges(finca);
      prep = PF.prepare(finca, norm);
      res = PF.generate(prep, finca);
    } else { prep = null; res = { trees: [], counts: {}, total: 0 }; }
    finca.total = res.total; refreshMap(); refreshDynamic(); persist();
  }

  /* ---------- helpers geométricos de dibujo ---------- */
  function bufferXY(pts, m) {
    const out = [];
    for (let i = 0; i + 1 < pts.length; i++) {
      const a = pts[i], b = pts[i + 1], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
      if (!l) continue;
      const nx = -dy / l * m, ny = dx / l * m;
      out.push([[a[0] + nx, a[1] + ny], [b[0] + nx, b[1] + ny], [b[0] - nx, b[1] - ny], [a[0] - nx, a[1] - ny]]);
    }
    pts.forEach((p) => {
      const ring = [];
      for (let k = 0; k < 16; k++) ring.push([p[0] + m * Math.cos(k * Math.PI / 8), p[1] + m * Math.sin(k * Math.PI / 8)]);
      out.push(ring);
    });
    return out;
  }
  function closeRing(r) { return r.concat([r[0]]); }
  function polyFeature(coords, props) { return { type: 'Feature', properties: props || {}, geometry: { type: 'Polygon', coordinates: [closeRing(coords)] } }; }

  /* ---------- mapa ---------- */
  let map = null, mapReady = false, hlIdx = -1, hlT = null;
  function initMap() {
    if (typeof maplibregl === 'undefined') { toast('No se pudo cargar MapLibre (¿sin conexión?)', 8000); return; }
    const style = {
      version: 8,
      sources: {
        osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19, attribution: '&copy; OpenStreetMap' },
        topo: { type: 'raster', tiles: ['https://a.tile.opentopomap.org/{z}/{x}/{y}.png','https://b.tile.opentopomap.org/{z}/{x}/{y}.png','https://c.tile.opentopomap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 17, attribution: '&copy; OpenStreetMap, SRTM, &copy; OpenTopoMap' },
        pnoa: { type: 'raster', tiles: ['https://www.ign.es/wmts/pnoa-ma?service=WMTS&request=GetTile&version=1.0.0&layer=OI.OrthoimageCoverage&style=default&format=image/jpeg&tilematrixset=GoogleMapsCompatible&tilematrix={z}&tilerow={y}&tilecol={x}'], tileSize: 256, maxzoom: 19, attribution: 'PNOA &copy; IGN' }
      },
      layers: [
        { id: 'osm', type: 'raster', source: 'osm' },
        { id: 'topo', type: 'raster', source: 'topo', layout: { visibility: 'none' } },
        { id: 'pnoa', type: 'raster', source: 'pnoa', layout: { visibility: 'none' } }
      ]
    };
    const c0 = store.center || CENTER_DEFAULT;

  // Simplifica el contorno (Visvalingam) hasta un máximo de vértices y elimina quiebros < 3 m²
  function simplifyRing(ring, maxN, minArea) {

  const SIGPAC_API = 'https://sigpac-hubcloud.es/ogcapi/collections/recintos/items';

  const pKey = (p) => [p.provincia, p.municipio, p.agregado || 0, p.zona || 0, p.poligono, p.parcela].join('-');

  async function sigpacQuery(params) {
    const ps = new URLSearchParams(Object.assign({ f: 'json', limit: '500' }, params));
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 25000);
    try {
      const r = await fetch(SIGPAC_API + '?' + ps, { signal: ctl.signal, headers: { Accept: 'application/geo+json, application/json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      const ks = ['provincia', 'municipio', 'agregado', 'zona', 'poligono', 'parcela', 'recinto'];
      return (d.features || []).filter((f) => f.geometry && ks.every((k) => params[k] == null || !f.properties || f.properties[k] == null || +f.properties[k] === +params[k]));
    } catch (e) { throw new Error(e.name === 'AbortError' ? 'sin respuesta' : e.message); } finally { clearTimeout(to); }
  }

  async function sigpacUsos(feats) {
    const falta = feats.filter((f) => f.properties && !f.properties.uso_sigpac).slice(0, 40);
    await Promise.all(falta.map(async (f) => {
      const p = f.properties;
      try {
        const r = await fetch('https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfo/' + p.provincia + '/' + p.municipio + '/' + (p.agregado || 0) + '/' + (p.zona || 0) + '/' + p.poligono + '/' + p.parcela + '/' + p.recinto + '.json');
        const d = await r.json(), x = Array.isArray(d) ? d[0] : d; if (x) { p.uso_sigpac = x.uso_sigpac; p.superficie = x.superficie; }
      } catch (e) { /* sin uso: se deja marcado */ }
    }));
  }
  // une recintos contiguos → { coords, huecos, partes }
  function unirRecintos(rings) {
    const Cl = window.ClipperLib;
    const area = (r) => PF.stats(r).area;
    if (!Cl) { const m = rings.slice().sort((a, b) => area(b) - area(a))[0]; return { coords: m, huecos: [], partes: rings.length }; }
    const cc = PF.centroidLL(rings[0]), pj = PF.makeProj(cc[0], cc[1]), SC = 1000;
    const toC = (r) => r.map((p) => { const q = pj.toXY(p[0], p[1]); return { X: Math.round(q[0] * SC), Y: Math.round(q[1] * SC) }; });
    const c = new Cl.Clipper(); rings.forEach((r) => c.AddPath(toC(r), Cl.PolyType.ptSubject, true));
    const u = new Cl.Paths(); c.Execute(Cl.ClipType.ctUnion, u, Cl.PolyFillType.pftNonZero, Cl.PolyFillType.pftNonZero);
    const co = new Cl.ClipperOffset(2, 20); co.AddPaths(u, Cl.JoinType.jtMiter, Cl.EndType.etClosedPolygon); const a = new Cl.Paths(); co.Execute(a, 0.05 * SC);
    const co2 = new Cl.ClipperOffset(2, 20); co2.AddPaths(a, Cl.JoinType.jtMiter, Cl.EndType.etClosedPolygon); const b = new Cl.Paths(); co2.Execute(b, -0.05 * SC);
    const fr = (pa) => pa.map((q) => pj.toLL(q.X / SC, q.Y / SC));

    (u.huecos || []).forEach((h) => finca.exclusions.push({ kind: 'poly', coords: simplifyRing(h, 12) }));
    if (u.huecos && u.huecos.length) recalc();

  // feats: recintos SIGPAC (de una o varias parcelas) → hoja para marcar los que forman la finca
  async function flowParcels(feats) {

    const rec = [];

    rec.sort((a, b) => (a.p.poligono - b.p.poligono) || (a.p.parcela - b.p.parcela) || (a.p.recinto - b.p.recinto));
    const parcelas = []; const seen = {};
    rec.forEach((r) => { const k = pKey(r.p); if (!seen[k]) { seen[k] = 1; parcelas.push(r.p); } });
    const name = pTxt(parcelas[0]) + (parcelas.length > 1 ? ' +' + (parcelas.length - 1) : '');
    if (rec.length === 1) { applyRecintos(rec, name); return; }
    const varias = parcelas.length > 1;

    if (!m) { toast('Referencia catastral no válida', 5000); return; }

    if (m) return sigpacParcel(m.slice(1, 7));

  function onFix(pos) {

    const pj = PF.makeProj(c.longitude, c.latitude), ring = [];
    for (let k = 0; k < 48; k++) ring.push(pj.toLL(c.accuracy * Math.cos(k * Math.PI / 24), c.accuracy * Math.sin(k * Math.PI / 24)));

    if (euc) {
      if (finca.uso !== 'eucalipto') add('danger', 'Moratoria del eucalipto (Lei 11/2021, prorrogada hasta 31/12/2030): las nuevas plantaciones sobre terrenos que no tenían eucalipto están prohibidas salvo excepciones tasadas, y no pueden sustituir coníferas ni frondosas. Uso anterior declarado: «' + USOS[finca.uso] + '». Confirma con el Distrito Forestal antes de plantar.');

    }
    if (finca.natura) add('warn', 'Red Natura 2000 / espacio protegido: requiere informe o autorización del órgano ambiental; no hay ayudas en hábitats prioritarios.');

    if (tipos.carretera) add('warn', 'Carretera: la distancia se mide desde el límite del dominio público (arista exterior de la cuneta), no desde la calzada. En las zonas de protección puede exigirse autorización del titular de la vía (Xunta, Deputación o Estado).');

  function econ() {

      const n = res.counts[sp], e = finca.econ.sp[sp] || {}, ha = n * sx * sy / 10000;

      '<details><summary>Exclusiones y subzonas</summary>' +
      '<div class="g2"><button class="btn sec" data-act="excl-poly">Zona excluida</button><div class="g2e"><button class="btn sec" data-act="excl-line">Línea + buffer</button><input id="buf" type="number" value="15" min="1" style="width:70px" title="Buffer (m)"></div></div>' +
      '<div class="g2e"><select id="zsp">' + optsObj(S, 'castano', (v) => v.name) + '</select><button class="btn sec" style="width:auto" data-act="subzona">Dibujar subzona</button></div>' +
      (finca.exclusions.map((e, i) => '<div class="sp"><span style="flex:1">' + (e.kind === 'line' ? 'Línea + ' + e.buffer + ' m' : 'Zona excluida') + ' #' + (i + 1) + '</span><button class="mini" data-act="del-excl" data-i="' + i + '">borrar</button></div>').join('')) +
      (finca.subzonas.map((z, i) => '<div class="sp"><span class="dot" style="background:' + S[z.sp].color + '"></span><span style="flex:1">Subzona ' + esc(S[z.sp].name) + ' #' + (i + 1) + '</span><button class="mini" data-act="del-zona" data-i="' + i + '">borrar</button></div>').join(''));
  }

  function tabInforme() {
    const row = (sp) => '<tr><td>' + esc(S[sp].name) + '</td>' +
      '<td><input type="number" step="any" inputmode="decimal" data-bind="econ.sp.' + sp + '.planta" value="' + val(finca.econ.sp[sp].planta) + '"></td>' +
      '<td><input type="number" step="any" inputmode="decimal" data-bind="econ.sp.' + sp + '.rend" value="' + val(finca.econ.sp[sp].rend) + '"></td>' +
      '<td><input type="number" step="any" inputmode="decimal" data-bind="econ.sp.' + sp + '.precio" value="' + val(finca.econ.sp[sp].precio) + '"></td>' +
      '<td><select data-bind="econ.sp.' + sp + '.destino"><option value="papelera"' + (finca.econ.sp[sp].destino === 'papelera' ? ' selected' : '') + '>Papelera/ENCE</option><option value="maderera"' + (finca.econ.sp[sp].destino === 'maderera' ? ' selected' : '') + '>Maderera</option></select></td></tr>';
    return '<div id="counts"></div>' +
      '<div class="g2"><button class="btn" data-act="report">Informe A4</button><button class="btn sec" data-act="export">Exportar GeoJSON</button></div>' +
      '<details><summary>Economía (editable; vacío = sin dato)</summary>' +
      '<div><label>Coste de plantación por árbol, mano de obra (€)</label><input type="number" step="any" inputmode="decimal" data-bind="econ.coste" value="' + val(finca.econ.coste) + '"></div>' +
      '<div style="overflow-x:auto"><table><tr><th>Especie</th><th>€/planta</th><th>m³/ha</th><th>€/m³</th><th>Destino</th></tr>' + Object.keys(S).map(row).join('') + '</table></div></details>' +
      '<div id="econres"></div>';
  }

  function tabNorma() {
    return '<h4>Avisos para esta finca</h4><div id="warns"></div>' +
      '<details><summary>Distancias mínimas (m) — editables</summary>' +
      '<div style="overflow-x:auto"><table><tr><th>Colinda con</th><th>Frondosas</th><th>Eucalipto/otras</th></tr>' +
      Object.keys(L).map((k) => '<tr><td>' + esc(L[k].label) + '</td><td><input type="number" step="any" min="0" data-norm="' + k + ':fr" value="' + norm[k].fr + '"></td><td><input type="number" step="any" min="0" data-norm="' + k + ':resto" value="' + norm[k].resto + '"></td></tr>').join('') + '</table></div>' +
      '<button class="btn sec" data-act="norm-reset">Restaurar valores por defecto</button></details>' +
      '<div class="muted">Base: Lei 7/2012 de montes de Galicia, art. 68 y anexo II (frondosas = especies del anexo I). Carreteras (4/10 m) y pistas (2/4 m): algunas fuentes citan 2 m para frondosas en carreteras; verifica. Las ordenanzas municipales pueden endurecer estas distancias. La moratoria del eucalipto (Lei 11/2021) está prorrogada hasta 31/12/2030, con excepciones. Esta herramienta es una ayuda de planificación; no sustituye la consulta al Distrito Forestal ni a los organismos titulares de ríos, carreteras, ferrocarril y líneas eléctricas.</div>';
  }

  function renderTab() {
    const t = { finca: tabFinca, linderos: tabLinderos, matriz: tabMatriz, informe: tabInforme, norma: tabNorma }[tab];
    const openD = [].slice.call(document.querySelectorAll('#tab-content details[open] > summary')).map((x) => x.textContent);
    $('#tab-content').innerHTML = t();
    document.querySelectorAll('#tab-content details').forEach((d) => { if (openD.indexOf(d.firstChild.textContent) >= 0) d.open = true; });
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('act', sheetOpen && b.dataset.tab === tab));
    $('#sheet-title').textContent = TITLES[tab];
    refreshDynamic();
  }
  $('#tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (sheetOpen && tab === b.dataset.tab) closeSheet(); else openSheet(b.dataset.tab);
  });
  $('#sheet-x').onclick = closeSheet;
  $('#n-x').onclick = () => $('#nsheet').classList.add('hidden');
  $('#h-back').onclick = showList;
  $('#h-more').onclick = () => { $('#hmenu').classList.toggle('hidden'); $('#menu').classList.add('hidden'); };
  $('#gps-status').onclick = () => { if (gpsWatch === null) startGPS(); else stopGPS(); };
  $('#strip').onclick = () => openSheet('informe');
  $('#finca-title').onclick = () => { if (!onList) openSheet('finca'); };
  $('#btn-lay').onclick = () => { $('#menu').classList.toggle('hidden'); };
  $('#btn-loc').onclick = () => { if (lastFix && mapReady) map.flyTo({ center: [lastFix[0], lastFix[1]], zoom: Math.max(map.getZoom(), 17) }); else toast(gpsWatch === null ? 'GPS apagado: actívalo en Capas' : 'Sin posición GPS todavía'); };

  /* ---------- eventos del contenido ---------- */
  function setPath(obj, path, v) {
    const ks = path.split('.'); let o = obj;
    for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
    o[ks[ks.length - 1]] = v;
  }
  function readVal(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.type === 'number') return el.value === '' ? null : +el.value;
    return el.value;
  }
  $('#tab-content').addEventListener('change', (e) => {
    const t = e.target, v = readVal(t);
    if (t.dataset.bind) {
      setPath(finca, t.dataset.bind, v);
      if (t.dataset.bind === 'concello') { renderTab(); }
      recalc();
    } else if (t.dataset.edge) {
      const a = t.dataset.edge.split(':'), i = +a[0], f = a[1];
      finca.edges[i][f] = v;
      if (f === 'tipo') renderTab();
      recalc();
    } else if (t.dataset.norm) {
      const a = t.dataset.norm.split(':'); norm[a[0]][a[1]] = num(v, 0); recalc();
    } else if (t.id === 'file') {
      const f = t.files && t.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try { setRing(PF.ringFromGeoJSON(JSON.parse(rd.result)), f.name.replace(/\.[^.]+$/, '')); toast('Finca importada'); }
        catch (err) { toast('Importación fallida: ' + err.message, 6000); }
      };
      rd.readAsText(f); t.value = '';
    }
  });

  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  const slug = (s) => String(s || 'finca').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'finca';

  function exportGeo() {
    if (!prep) { toast('No hay datos'); return; }
    const fc = { type: 'FeatureCollection', features: [polyFeature(finca.ring, { name: finca.name, tipo: 'finca' })].concat(
      res.trees.map((t) => ({ type: 'Feature', properties: { especie: S[t.sp].name, color: S[t.sp].color }, geometry: { type: 'Point', coordinates: prep.pj.toLL(t.x, t.y) } }))) };
    download('plantfinc-' + slug(finca.name) + '.geojson', JSON.stringify(fc), 'application/geo+json');
  }
  function fileImport(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { setRing(PF.ringFromGeoJSON(JSON.parse(rd.result)), f.name.replace(/\.[^.]+$/, '')); toast('Finca importada'); }
      catch (err) { toast('Importación fallida: ' + err.message, 6000); }
    };
    rd.readAsText(f); e.target.value = '';
  }
  $('#file').addEventListener('change', fileImport);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b || !b.closest('#tab-content,#hmenu,#vList,#nsheet,#fab,#rsheet')) return;
    const a = b.dataset.act, i = +b.dataset.i, id = b.dataset.id;
    $('#hmenu').classList.add('hidden');
    switch (a) {
      case 'draw-finca': startDraw('finca'); break;
      case 'import': $('#file').click(); break;
      case 'pick': startDraw('pick'); break;
      case 'gps-parcel': if (lastFix) parcelAtPoint(lastFix[0], lastFix[1]); else toast('Sin posición GPS todavía'); break;
      case 'search': searchParcel($('#q').value); break;
      case 'fit': closeSheet(); fitFinca(); break;
      case 'center-me': closeSheet(); if (lastFix && mapReady) map.flyTo({ center: [lastFix[0], lastFix[1]], zoom: 18 }); else toast('Sin posición GPS todavía'); break;
      case 'l-open': if (store.fincas[id]) openFinca(store.fincas[id]); break;
      case 'l-edit': if (store.fincas[id]) { openFinca(store.fincas[id]); openSheet('finca'); } break;
      case 'l-exp': if (store.fincas[id]) { openFinca(store.fincas[id]); exportGeo(); } break;
      case 'l-copy': if (store.fincas[id]) { const c = JSON.parse(JSON.stringify(store.fincas[id])); c.id = 'f' + Date.now(); c.name += ' (copia)'; c.mod = Date.now(); store.fincas[c.id] = c; try { localStorage.setItem(LS, JSON.stringify(store)); } catch (er) { /* */ } renderList(); toast('Finca copiada'); } break;
      case 'l-del': if (store.fincas[id] && confirm('¿Eliminar «' + store.fincas[id].name + '» de este dispositivo?')) { delete store.fincas[id]; if (store.last === id) store.last = null; try { localStorage.setItem(LS, JSON.stringify(store)); } catch (er) { /* */ } renderList(); } break;
      case 'l-new': $('#n-conc').innerHTML = optsObj(C, 'abegondo', (v) => v.name); $('#n-name').value = ''; $('#n-q').value = ''; $('#nsheet').classList.remove('hidden'); break;
      case 'l-import': flush(); finca = newFinca(); enterMap(); recalc(); renderTab(); $('#file').click(); break;
      case 'n-pick': createFromSheet(); startSigpac(); break;
      case 'sigpac-map': startSigpac(); break;
      case 'n-gps': if (lastFix) { createFromSheet(); parcelAtPoint(lastFix[0], lastFix[1]); } else toast('Sin posición GPS todavía'); break;
      case 'n-search': { const q = $('#n-q').value; if (!q.trim()) { toast('Escribe un código SIGPAC o referencia catastral'); break; } createFromSheet(); searchParcel(q); break; }
      case 'n-import': createFromSheet(); $('#file').click(); break;
      case 'del': {
        if (!confirm('¿Eliminar la finca «' + finca.name + '» de este dispositivo?')) break;
        delete store.fincas[finca.id]; store.last = null;
        try { localStorage.setItem(LS, JSON.stringify(store)); } catch (er) { /* sin espacio */ }
        finca = newFinca(); showList();
        break;
      }
      case 'save-center': if (mapReady) { const c = map.getCenter(); store.center = [c.lng, c.lat]; try { localStorage.setItem(LS, JSON.stringify(store)); } catch (er) { /* */ } toast('Centro de inicio guardado'); } break;
      case 'hl':
        openEdge = openEdge === i ? -1 : i; renderTab();
        hlIdx = i; refreshMap(); clearTimeout(hlT); hlT = setTimeout(() => { hlIdx = -1; refreshMap(); }, 3000);
        if (mapReady) { const p = finca.ring[i], q = finca.ring[(i + 1) % finca.ring.length]; map.easeTo({ center: [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2] }); }
        break;
      case 'recalc': recalc(); break;
      case 'resimp': if (!finca.ringOrig) { toast('Vuelve a elegir la parcela en SIGPAC'); break; } finca.maxEdges = Math.max(3, Math.min(60, Math.round(num(finca.maxEdges, 20)))); finca.ring = simplifyRing(finca.ringOrig, finca.maxEdges); finca.edges = []; PF.ensureEdges(finca); finca.params.anchor = null; openEdge = -1; recalc(); renderTab(); toast(finca.ring.length + ' linderos (se han reiniciado sus tipos)'); break;
      case 'optimize': {
        if (!prep) { toast('Dibuja o importa una finca primero'); break; }
        toast('Calculando mejor ángulo…', 8000);
        setTimeout(() => {
          const before = res.total, best = PF.optimize(prep, finca, 2.5, 4);
          finca.params.angle = best.angle; finca.params.shU = +best.shU.toFixed(3); finca.params.shV = +best.shV.toFixed(3);
          recalc(); renderTab(); toast('Mejor: ' + best.total + ' árboles a ' + best.angle + '° (antes ' + before + ')', 6000);
        }, 30);
        break;
      }
      case 'anchor-gps': if (lastFix) { finca.params.anchor = [lastFix[0], lastFix[1]]; recalc(); renderTab(); toast('Matriz anclada a tu posición'); } else toast('Sin posición GPS todavía'); break;
      case 'anchor-map': startDraw('anchor'); break;
      case 'anchor-clear': finca.params.anchor = null; recalc(); renderTab(); break;
      case 'excl-poly': startDraw('excl-poly'); break;
      case 'excl-line': startDraw('excl-line'); break;
      case 'subzona': startDraw('subzona'); break;
      case 'del-excl': finca.exclusions.splice(i, 1); recalc(); renderTab(); break;
      case 'del-zona': finca.subzonas.splice(i, 1); recalc(); renderTab(); break;
      case 'norm-reset': { const d = PF.defaultNorm(); Object.keys(d).forEach((k) => { norm[k] = d[k]; }); recalc(); renderTab(); break; }
      case 'report': openReport(); break;
      case 'export': exportGeo(); break;
    }
  });

  /* ---------- informe A4 ---------- */
  function openReport() {
    if (!prep || !res.total) { toast('No hay árboles que mostrar'); return; }
    const ring = prep.ring;
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    ring.forEach((p) => { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
    const W = 190, H = 190, w = maxx - minx, h = maxy - miny;
    const dens = [100, 200, 250, 500, 750, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 7500, 10000, 15000, 20000, 30000];
    const den = dens.find((d) => w * 1000 / d <= W - 10 && h * 1000 / d <= H - 10) || 50000, k = 1000 / den;
    const X = (x) => ((W - w * k) / 2 + (x - minx) * k).toFixed(2), Y = (y) => ((H - h * k) / 2 + (maxy - y) * k).toFixed(2);
    const path = (pts) => 'M' + pts.map((p) => X(p[0]) + ',' + Y(p[1])).join('L') + 'Z';
    const rr = Math.max(0.35, Math.min(finca.params.sx, finca.params.sy) * k * 0.3);
    let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="190mm" height="190mm"><defs><pattern id="h" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2" stroke="#c62828" stroke-width="0.4"/></pattern></defs>';
    svg += '<rect width="' + W + '" height="' + H + '" fill="#fff" stroke="#888" stroke-width="0.3"/>';
    svg += '<path d="' + path(ring) + '" fill="#f1f8e9" stroke="none"/>';
    prep.zones.forEach((z) => { svg += '<path d="' + path(z.pts) + '" fill="' + S[z.sp].color + '" fill-opacity="0.18" stroke="none"/>'; });
    prep.excl.forEach((e) => {
      if (e.kind === 'poly') svg += '<path d="' + path(e.pts) + '" fill="url(#h)" stroke="#c62828" stroke-width="0.3"/>';
      else {
        bufferXY(e.pts, e.buf).forEach((r) => { svg += '<path d="' + path(r) + '" fill="url(#h)" stroke="none"/>'; });
        svg += '<path d="M' + e.pts.map((p) => X(p[0]) + ',' + Y(p[1])).join('L') + '" fill="none" stroke="#c62828" stroke-width="0.4" stroke-dasharray="2,1"/>';
      }
    });
    res.trees.forEach((t) => { svg += '<circle cx="' + X(t.x) + '" cy="' + Y(t.y) + '" r="' + rr.toFixed(2) + '" fill="' + S[t.sp].color + '" stroke="#fff" stroke-width="0.08"/>'; });
    ring.forEach((p, i) => {
      const q = ring[(i + 1) % ring.length];
      svg += '<line x1="' + X(p[0]) + '" y1="' + Y(p[1]) + '" x2="' + X(q[0]) + '" y2="' + Y(q[1]) + '" stroke="' + (L[finca.edges[i].tipo] || L.libre).color + '" stroke-width="0.7"/>';
      svg += '<text x="' + ((+X(p[0]) + +X(q[0])) / 2).toFixed(2) + '" y="' + ((+Y(p[1]) + +Y(q[1])) / 2).toFixed(2) + '" font-size="3" fill="#000" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="0.6">' + (i + 1) + '</text>';
    });
    // escala gráfica
    const Ls = [5, 10, 20, 50, 100, 200, 500].find((v) => v * k >= 15 && v * k <= 60) || 50, sl = Ls * k;
    svg += '<g transform="translate(8,' + (H - 8) + ')"><rect x="0" y="-1.5" width="' + (sl / 2).toFixed(1) + '" height="1.5" fill="#000"/><rect x="' + (sl / 2).toFixed(1) + '" y="-1.5" width="' + (sl / 2).toFixed(1) + '" height="1.5" fill="#fff" stroke="#000" stroke-width="0.2"/><text x="0" y="-3" font-size="3">0</text><text x="' + sl.toFixed(1) + '" y="-3" font-size="3" text-anchor="end">' + Ls + ' m</text></g>';
    // norte
    svg += '<g transform="translate(' + (W - 12) + ',16)"><path d="M0,-9 L4,3 L0,0 L-4,3 Z" fill="#000"/><text x="0" y="9" font-size="4" text-anchor="middle" font-weight="bold">N</text></g></svg>';

    const st = PF.stats(finca.ring), fm = ferradoM2();
    const legend = Object.keys(S).filter((s) => res.counts[s]).map((s) => '<tr><td><span class="d" style="background:' + S[s].color + '"></span></td><td>' + esc(S[s].name) + '</td><td class="r">' + res.counts[s] + '</td></tr>').join('');
    const ec = econ(), hasEcon = ec.cost > 0 || ec.inc > 0;
    const wl = warnings().filter((x) => x.l !== 'info').map((x) => '<li>' + esc(x.t) + '</li>').join('');
    const html = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Informe ' + esc(finca.name) + '</title><style>' +
      '@page{size:A4 portrait;margin:10mm}body{font:11px Arial,sans-serif;color:#000;margin:0}h1{font-size:15px;margin:0 0 2px}' +
      '.sub{color:#444;margin-bottom:4px}svg{display:block}table{border-collapse:collapse}td{padding:1px 6px}.r{text-align:right;font-weight:bold}' +
      '.d{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid #555}.cols{display:flex;gap:16px;margin-top:6px;align-items:flex-start}' +
      'ul{margin:2px 0 0 14px;padding:0;font-size:9px}.btn{position:fixed;top:6px;right:6px}@media print{.btn{display:none}}</style></head><body>' +
      '<button class="btn" onclick="print()">Imprimir</button>' +
      '<h1>' + esc(finca.name) + ' — Plan de plantación</h1>' +
      '<div class="sub">' + esc(C[finca.concello].name) + ' · ' + (st.area / 10000).toFixed(2) + ' ha' + (fm ? ' (' + (st.area / fm).toFixed(1) + ' ferrados de ' + fm + ' m²)' : '') + ' · Perímetro ' + Math.round(st.perimeter) + ' m · Marco ' + finca.params.sx + '×' + finca.params.sy + ' m · Ángulo ' + (+finca.params.angle).toFixed(1) + '° · Escala 1:' + den + ' (A4) · ' + new Date().toLocaleDateString('es-ES') + '</div>' +
      svg +
      '<div class="cols"><div><b>Leyenda</b><table>' + legend + '<tr><td></td><td><b>Total</b></td><td class="r">' + res.total + '</td></tr></table></div>' +
      (hasEcon ? '<div><b>Economía estimada</b><br>Coste: ' + eur(ec.cost) + '<br>Ingreso: ' + eur(ec.inc) + '</div>' : '') +
      '<div style="flex:1"><b>Avisos</b><ul>' + (wl || '<li>Sin avisos críticos.</li>') + '</ul></div></div>' +
      '<div style="margin-top:4px;font-size:8px;color:#555">Lindero numerado en plano. Distancias según Lei 7/2012 (art. 68, anexo II) salvo ajustes del usuario. Documento de planificación; verificar con las administraciones competentes.</div>' +
      '</body></html>';
    const win = window.open('', '_blank');
    if (win) { win.document.write(html); win.document.close(); setTimeout(() => { try { win.print(); } catch (er) { /* el usuario puede imprimir con el botón */ } }, 600); }
    else { download('informe-' + slug(finca.name) + '.html', html, 'text/html'); toast('Ventana bloqueada: informe descargado como HTML (ábrelo e imprime).', 6000); }
  }

  /* ---------- arranque ---------- */
  finca = newFinca();
  renderTab();
  initMap();
  showList();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
